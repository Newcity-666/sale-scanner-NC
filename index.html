<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสแกนขายสินค้า</title>

  <!-- PWA Metadata สำหรับติดตั้งลงหน้าจอมือถือ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sales Scan">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3144/3144456.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3144/3144456.png">

  <!-- Quagga2 Library -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; width: 100%; max-width: 480px; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
    
    /* กล้องสแกน */
    #interactive.viewport { position: relative; width: 100%; height: 250px; background: #000; border-radius: 8px; overflow: hidden; }
    #interactive.viewport canvas, #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
    canvas.drawingBuffer { position: absolute; top: 0; left: 0; }

    /* ปุ่มกด */
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ตารางรายการ */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    th { background: #f8fafc; }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="margin-top:0; text-align:center;">สแกนบาร์โค้ดสินค้า</h2>
    
    <!-- ช่องแสดงกล้อง -->
    <div id="interactive" class="viewport"></div>

    <button id="btnToggleCam" class="btn btn-primary" onclick="toggleScanner()">📷 เปิดกล้องสแกน</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">รายการสินค้าในบิล</h3>
    <table>
      <thead>
        <tr>
          <th>บาร์โค้ด</th>
          <th style="width: 60px; text-align: center;">จำนวน</th>
        </tr>
      </thead>
      <tbody id="itemList">
        <tr><td colspan="2" style="text-align: center; color: #9ca3af;">ยังไม่มีรายการ</td></tr>
      </tbody>
    </table>

    <button id="btnSubmit" class="btn btn-success" onclick="submitBill()" disabled>✅ จบบิล / บันทึกข้อมูล</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIG: ใส่ URL ของ Google Apps Script ของคุณที่นี่
    // -------------------------------------------------------------
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    let isScanning = false;
    let items = []; // เก็บรายการบาร์โค้ดที่สแกนได้

    // ฟังก์ชัน เปิด/ปิด กล้องสแกน
    function toggleScanner() {
      if (isScanning) {
        stopScanner();
      } else {
        startScanner();
      }
    }

    function startScanner() {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment", // บังคับใช้กล้องหลัง
            width: { min: 640 },
            height: { min: 480 }
          }
        },
        locator: { patchSize: "medium", halfSample: true },
        numOfWorkers: navigator.hardwareConcurrency || 4,
        decoder: {
          readers: [
            "code_128_reader", // บาร์โค้ดทั่วไป
            "ean_reader",      // บาร์โค้ดสินค้า (EAN-13)
            "ean_8_reader",
            "code_39_reader"
          ]
        },
        locate: true
      }, function(err) {
        if (err) {
          alert("ไม่สามารถเปิดกล้องได้: " + err);
          return;
        }
        Quagga.start();
        isScanning = true;
        document.getElementById('btnToggleCam').innerText = "⏹️ ปิดกล้อง";
        document.getElementById('btnToggleCam').className = "btn btn-danger";
      });

      // เมื่อสแกนพบบาร์โค้ด
      Quagga.onDetected(onBarcodeDetected);
    }

    function stopScanner() {
      if (isScanning) {
        Quagga.offDetected(onBarcodeDetected);
        Quagga.stop();
        isScanning = false;
        document.getElementById('btnToggleCam').innerText = "📷 เปิดกล้องสแกน";
        document.getElementById('btnToggleCam').className = "btn btn-primary";
      }
    }

    function onBarcodeDetected(result) {
      if (result && result.codeResult && result.codeResult.code) {
        let code = result.codeResult.code;

        // ปิดอีเวนต์ชั่วคราวเพื่อป้องกันสแกนรวดเดียวหลายรอบ
        Quagga.offDetected(onBarcodeDetected);

        playBeep();
        addItem(code);

        // หน่วงเวลา 1.2 วินาทีแล้วเริ่มจับบาร์โค้ดอันต่อไป
        setTimeout(() => {
          if (isScanning) {
            Quagga.onDetected(onBarcodeDetected);
          }
        }, 1200);
      }
    }

    // เพิ่มรายการบาร์โค้ดลงตาราง
    function addItem(code) {
      let existing = items.find(i => i.code === code);
      if (existing) {
        existing.qty += 1;
      } else {
        items.push({ code: code, qty: 1 });
      }
      renderTable();
    }

    // แสดงรายการในหน้าจอ
    function renderTable() {
      let tbody = document.getElementById('itemList');
      let btnSubmit = document.getElementById('btnSubmit');

      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #9ca3af;">ยังไม่มีรายการ</td></tr>';
        btnSubmit.disabled = true;
        return;
      }

      btnSubmit.disabled = false;
      tbody.innerHTML = items.map(item => `
        <tr>
          <td><b>${item.code}</b></td>
          <td style="text-align: center;">${item.qty}</td>
        </tr>
      `).join('');
    }

    // เสียงสัญญาณ Beep เมื่อสแกนติด
    function playBeep() {
      try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 1200;
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    // ฟังก์ชันส่งข้อมูลจบบิลไปที่ Google Apps Script
    function submitBill() {
      if (items.length === 0) return;

      let btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.innerText = "⏳ กำลังบันทึกข้อมูล...";

      // สร้างเลขบิล BILL-Timestamp
      let billId = "BILL-" + Date.now();

      let payload = {
        billId: billId,
        items: items,
        timestamp: new Date().toISOString()
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("บันทึกบิลสำเร็จ! เลขที่บิล: " + billId);
        items = [];
        renderTable();
      })
      .catch(err => {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + err);
      })
      .finally(() => {
        btnSubmit.innerText = "✅ จบบิล / บันทึกข้อมูล";
      });
    }
  </script>
</body>
</html>
