<script>
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, false);

  const API_URL = "https://script.google.com/macros/s/AKfycbzXoqQQJYtOkUvdsmLKnd_-gw6G37olfCa1SyZl5VwahDSNkYAdsUTaGI6sCIhiW-Mzew/exec";

  let currentProductData = null;
  let cart = [];
  let isScanning = false;
  let activeEngine = "old"; 
  const scannedCache = {};

  let html5QrcodeScanner = null;
  let scanHistoryOld = [];

  window.onload = function() { 
    loadStoreList(); 
    detectOptimalEngine();
  };

  function detectOptimalEngine() {
    activeEngine = "old";
  }

  function switchEngineManually(val) {
    if (isScanning) stopScanner();
    if (val === "auto") detectOptimalEngine();
    else activeEngine = val;
  }

  function loadStoreList() {
    fetch(`${API_URL}?action=getStores`)
      .then(res => res.json())
      .then(data => {
        if (data.stores) {
          const datalist = document.getElementById('branch-list');
          datalist.innerHTML = '';
          data.stores.forEach(store => {
            const opt = document.createElement('option');
            opt.value = store;
            datalist.appendChild(opt);
          });
        }
      })
      .catch(err => console.error(err));
  }

  function toggleScanner() {
    if (isScanning) stopScanner();
    else startScanner();
  }

  function startScanner() {
    const scannerBox = document.getElementById('scanner-box');
    const btn = document.getElementById('btnToggleScan');

    scannerBox.style.display = "block";
    btn.innerText = "🛑 ปิดกล้อง";
    btn.classList.add("active");
    isScanning = true;

    if (activeEngine === "new") {
      document.getElementById('reader-html5').style.display = "block";
      document.getElementById('scanner-quagga').style.display = "none";
      startHtml5Scanner();
    } else {
      document.getElementById('reader-html5').style.display = "none";
      document.getElementById('scanner-quagga').style.display = "block";
      startQuaggaScanner();
    }
  }

  function stopScanner() {
    if (activeEngine === "new") stopHtml5Scanner();
    else stopQuaggaScanner();

    document.getElementById('scanner-box').style.display = "none";
    document.getElementById('reader-html5').style.display = "none";
    document.getElementById('scanner-quagga').style.display = "none";
    
    const btn = document.getElementById('btnToggleScan');
    btn.innerText = "📷 เปิดกล้องสแกน";
    btn.classList.remove("active");
    isScanning = false;
  }

  // ==========================================
  // 1. ENGINE Html5Qrcode
  // ==========================================
  function startHtml5Scanner() {
    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5Qrcode("reader-html5");
    }

    const config = { 
      fps: 15,
      qrbox: { width: 260, height: 130 },
      videoConstraints: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
      formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.CODE_128 ]
    };

    html5QrcodeScanner.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        let cleanText = decodedText.trim();
        if (cleanText.length >= 3) {
          onScanSuccess(cleanText);
        }
      },
      () => {}
    ).catch(err => {
      activeEngine = "old";
      startScanner();
    });
  }

  function stopHtml5Scanner() {
    if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
      html5QrcodeScanner.stop().catch(err => console.error(err));
    }
  }

  // ==========================================
  // 2. ENGINE Quagga2 (แก้ไขอาการกล้องกระพริบ + เสถียรสูง)
  // ==========================================
  function startQuaggaScanner() {
    scanHistoryOld = [];

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#scanner-quagga'),
        constraints: {
          facingMode: "environment",
          width: { ideal: 640 },  // ลดความละเอียดลงเล็กน้อยเพื่อให้กล้องไม่โหลดหนักและภาพลื่นไหล
          height: { ideal: 480 }
        },
        area: { top: "15%", right: "5%", left: "5%", bottom: "15%" } // ขยายพื้นที่อ่านให้กว้างขึ้น
      },
      locator: { 
        patchSize: "medium", 
        halfSample: true // ช่วยประมวลผลเร็วขึ้นมากบนมือถือรุ่นเก่า
      },
      numOfWorkers: 2,
      decoder: { 
        readers: ["ean_reader", "code_128_reader"],
        multiple: false 
      },
      locate: true
    }, function(err) {
      if (err) {
        console.error("Quagga Init Error:", err);
        alert("ไม่สามารถเปิดกล้องได้ โปรดตรวจสอบการอนุญาตใช้งานกล้อง");
        stopScanner();
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(onQuaggaDetected);
  }

  function stopQuaggaScanner() {
    try {
      Quagga.offDetected(onQuaggaDetected);
      Quagga.stop();
    } catch(e) {}
  }

  function onQuaggaDetected(result) {
    if (result && result.codeResult && result.codeResult.code) {
      let barcodeText = result.codeResult.code.trim();
      
      // ตรวจสอบความสมบูรณ์ของผลลัพธ์เพื่อลดการอ่านค่าผิดพลาดจากภาพไม่คม
      if (result.codeResult.format === "ean_13" && barcodeText.length !== 13) return;

      if (barcodeText.length >= 3) {
        scanHistoryOld.push(barcodeText);
        if (scanHistoryOld.length > 4) scanHistoryOld.shift();

        const counts = {};
        scanHistoryOld.forEach(code => { counts[code] = (counts[code] || 0) + 1; });

        // ยืนยันค่าเดียวกัน 2 ครั้งเพื่อป้องกันการอ่านผิดจากบาร์โค้ดจาง
        if (counts[barcodeText] >= 2) {
          Quagga.offDetected(onQuaggaDetected);
          onScanSuccess(barcodeText);
        }
      }
    }
  }

  // ==========================================
  // 3. COMMON FUNCTIONS
  // ==========================================
  function onScanSuccess(barcodeText) {
    stopScanner();
    document.getElementById('barcode-input').value = barcodeText;
    if (navigator.vibrate) navigator.vibrate(200);
    lookupBarcode(barcodeText);
  }

  function lookupBarcode(barcode) {
    const cleanBarcode = barcode ? barcode.trim() : '';
    if (!cleanBarcode) { resetDisplayInfo(); return; }

    if (scannedCache[cleanBarcode]) {
      const res = scannedCache[cleanBarcode];
      currentProductData = res;
      if (res.found) {
        document.getElementById('display-sku').innerText = res.sku || '-';
        document.getElementById('display-sku').className = "info-value";
        document.getElementById('display-product').innerText = res.product || '-';
      } else {
        document.getElementById('display-sku').innerText = "ไม่พบข้อมูล";
        document.getElementById('display-sku').className = "info-value status-notFound";
        document.getElementById('display-product').innerText = "⚠️ ไม่พบ Barcode ในระบบ";
      }
      setLoadingState(false);
      return;
    }

    setLoadingState(true, "⏳ กำลังดึงข้อมูล...");

    fetch(`${API_URL}?action=getProduct&barcode=${encodeURIComponent(cleanBarcode)}`)
      .then(res => res.json())
      .then(res => {
        scannedCache[cleanBarcode] = res;
        if (res && res.found) {
          currentProductData = res;
          document.getElementById('display-sku').innerText = res.sku || '-';
          document.getElementById('display-sku').className = "info-value";
          document.getElementById('display-product').innerText = res.product || '-';
        } else {
          currentProductData = { barcode: cleanBarcode, sku: '-', product: 'ไม่พบข้อมูล' };
          document.getElementById('display-sku').innerText = "ไม่พบข้อมูล";
          document.getElementById('display-sku').className = "info-value status-notFound";
          document.getElementById('display-product').innerText = "⚠️ ไม่พบ Barcode ในระบบ";
        }
        setLoadingState(false);
      })
      .catch(err => {
        document.getElementById('display-sku').innerText = "Error";
        document.getElementById('display-sku').className = "info-value status-notFound";
        document.getElementById('display-product').innerText = "⚠️ ขัดข้อง: เชื่อมต่อเซิร์ฟเวอร์ไม่ได้";
        document.getElementById('btnAdd').disabled = true;
      });
  }

  function setLoadingState(isLoading, message) {
    const btnAdd = document.getElementById('btnAdd');
    if (isLoading) {
      btnAdd.disabled = true;
      btnAdd.innerText = message || "⏳ กำลังดึงข้อมูล...";
      document.getElementById('display-sku').innerText = "⏳...";
      document.getElementById('display-sku').className = "info-value status-loading";
      document.getElementById('display-product').innerText = "⏳...";
    } else {
      btnAdd.disabled = false;
      btnAdd.innerText = "+ เพิ่มรายการ";
    }
  }

  function resetDisplayInfo() {
    document.getElementById('display-sku').innerText = "-";
    document.getElementById('display-sku').className = "info-value";
    document.getElementById('display-product').innerText = "-";
    document.getElementById('btnAdd').disabled = true;
    document.getElementById('btnAdd').innerText = "+ เพิ่มรายการ";
    currentProductData = null;
  }

  function changeQty(delta) {
    const qtyInput = document.getElementById('qty-input');
    let currentVal = parseInt(qtyInput.value) || 1;
    let newVal = currentVal + delta;
    if (newVal < 1) newVal = 1;
    qtyInput.value = newVal;
  }

  function handleQtyFocus(input) {
    input.dataset.oldValue = input.value;
    input.value = '';
  }

  function handleQtyBlur(input) {
    if (input.value.trim() === '' || parseInt(input.value) <= 0) {
      input.value = input.dataset.oldValue && parseInt(input.dataset.oldValue) > 0 ? input.dataset.oldValue : '1';
    }
  }

  function addToCart() {
    const barcode = document.getElementById('barcode-input').value.trim();
    const qty = parseInt(document.getElementById('qty-input').value) || 1;

    if (!barcode) return;
    if (cart.length >= 10) { alert("เพิ่มได้สูงสุด 10 รายการต่อบิล"); return; }

    const existingIndex = cart.findIndex(item => item.barcode === barcode);
    if (existingIndex > -1) {
      cart[existingIndex].quantity += qty;
    } else {
      cart.push({
        barcode: barcode,
        sku: currentProductData ? currentProductData.sku : '-',
        product: currentProductData ? currentProductData.product : 'ไม่พบข้อมูล',
        quantity: qty
      });
    }

    renderCart();
    document.getElementById('barcode-input').value = '';
    resetDisplayInfo();
    document.getElementById('qty-input').value = '1';
  }

  function renderCart() {
    const tbody = document.getElementById('cart-list');
    tbody.innerHTML = '';
    cart.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align:center; font-weight:bold; color:#718096;">${index + 1}</td>
        <td><b>${item.barcode}</b></td>
        <td><b>${item.product}</b></td>
        <td style="text-align:center;">
          <div style="display:inline-flex; align-items:center; gap:3px;">
            <button class="btn-table-qty" onclick="updateItemQty(${index}, -1)">-</button>
            <span style="font-weight:bold; width:20px; text-align:center;">${item.quantity}</span>
            <button class="btn-table-qty" onclick="updateItemQty(${index}, 1)">+</button>
          </div>
        </td>
        <td style="text-align:center;"><button class="btn-del" onclick="removeFromCart(${index})">X</button></td>
      `;
      tbody.appendChild(tr);
    });
    document.getElementById('cart-count').innerText = cart.length;
  }

  function updateItemQty(index, delta) {
    if (cart[index]) {
      let newQty = cart[index].quantity + delta;
      if (newQty >= 1) {
        cart[index].quantity = newQty;
        renderCart();
      }
    }
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function submitBill() {
    const branch = document.getElementById('branch-input').value.trim();
    if (!branch) { alert("กรุณากรอกชื่อสาขา"); return; }
    if (cart.length === 0) { alert("กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ"); return; }

    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('btnAdd').disabled = true;
    document.getElementById('btnSubmit').innerText = "⏳ กำลังบันทึก...";

    const payload = { branch: branch, items: cart };

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      document.getElementById('btnSubmit').disabled = false;
      document.getElementById('btnSubmit').innerText = "จบบิล";

      if (res.success) {
        alert(`บันทึกเรียบร้อย!\nเลขที่บิล: ${res.billId}`);
        cart = [];
        renderCart();
      } else {
        alert("เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: " + res.error);
      }
    })
    .catch(err => {
      document.getElementById('btnSubmit').disabled = false;
      document.getElementById('btnSubmit').innerText = "จบบิล";
      alert("ไม่สามารถบันทึกได้ โปรดตรวจสอบอินเทอร์เน็ตหรือ Web App URL");
    });
  }
</script>
